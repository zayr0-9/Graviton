name: Desktop Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x]
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: ygg-chat/package-lock.json

      - name: Install workspace dependencies
        run: |
          cd ygg-chat
          npm ci --include=optional

      - name: Ensure Rollup native binary is present
        shell: bash
        run: |
          set -euo pipefail
          cd ygg-chat

          case "${{ matrix.os }}" in
            ubuntu-latest)
              ROLLUP_PKG="@rollup/rollup-linux-x64-gnu"
              ;;
            macos-latest)
              NODE_ARCH="$(node -p "process.arch")"
              if [ "${NODE_ARCH}" = "arm64" ]; then
                ROLLUP_PKG="@rollup/rollup-darwin-arm64"
              else
                ROLLUP_PKG="@rollup/rollup-darwin-x64"
              fi
              ;;
            windows-latest)
              ROLLUP_PKG="@rollup/rollup-win32-x64-msvc"
              ;;
            *)
              echo "Unsupported OS for rollup preflight: ${{ matrix.os }}"
              exit 1
              ;;
          esac

          ROLLUP_VERSION="$(node -p "require('./client/ygg-chat-r/node_modules/rollup/package.json').version")"
          echo "Expected Rollup native package: ${ROLLUP_PKG}@${ROLLUP_VERSION}"

          if node -e "require.resolve('${ROLLUP_PKG}', { paths: ['./client/ygg-chat-r'] })" >/dev/null 2>&1; then
            echo "Rollup native package already present"
          else
            echo "Rollup native package missing; installing fallback"
            npm --prefix client/ygg-chat-r install --no-save --include=optional "${ROLLUP_PKG}@${ROLLUP_VERSION}"
          fi

      - name: Validate tag matches app version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(node -p "require('./ygg-chat/client/ygg-chat-r/package.json').version")"

          echo "Tag version: ${TAG_VERSION}"
          echo "App version: ${APP_VERSION}"

          if [ "${TAG_VERSION}" != "${APP_VERSION}" ]; then
            echo "ERROR: Tag version (${TAG_VERSION}) does not match client/ygg-chat-r/package.json version (${APP_VERSION})"
            exit 1
          fi

      - name: Extract release notes from changelog
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG_FILE="ygg-chat/client/ygg-chat-r/CHANGELOG.md"
          RELEASE_NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          RAW_RELEASE_NOTES_FILE="${RELEASE_NOTES_FILE}.raw"

          : > "${RAW_RELEASE_NOTES_FILE}"

          if [ -f "${CHANGELOG_FILE}" ]; then
            awk -v ver="${VERSION}" '
              $0 ~ "^## \\[" ver "\\]" || $0 ~ "^## " ver "([[:space:]-]|$)" {
                in_section = 1
                next
              }
              in_section && /^## / { exit }
              in_section { print }
            ' "${CHANGELOG_FILE}" > "${RAW_RELEASE_NOTES_FILE}" || true
          else
            echo "WARNING: ${CHANGELOG_FILE} not found; using fallback release notes"
          fi

          awk '
            BEGIN { started = 0 }
            {
              if (!started && $0 ~ /^[[:space:]]*$/) next
              started = 1
              print
            }
          ' "${RAW_RELEASE_NOTES_FILE}" > "${RELEASE_NOTES_FILE}" || true

          if ! grep -q '[^[:space:]]' "${RELEASE_NOTES_FILE}" 2>/dev/null; then
            printf 'Release %s\n\nAutomated release build.\nChangelog entry missing, empty, or malformed, so fallback release notes were used.\n' "${VERSION}" > "${RELEASE_NOTES_FILE}"
            echo "WARNING: No usable changelog entry found for version ${VERSION}; using fallback release notes"
          else
            echo "Release notes extracted to ${RELEASE_NOTES_FILE}"
          fi

      - name: Build ${{ matrix.os }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          cd ygg-chat
          npm run build:electron
          # The github provider in electron-builder.json is only baked into app-update.yml here;
          # publish_release below is the single uploader, so never let electron-builder publish.
          case "${{ matrix.os }}" in
            ubuntu-latest) npm run package:electron -- --linux --publish never ;;
            macos-latest) npm run package:electron -- --mac --publish never ;;
            windows-latest) npm run package:electron -- --win --publish never ;;
          esac
        shell: bash

      - name: Inject release notes into update manifest
        shell: bash
        run: |
          set -euo pipefail
          cd ygg-chat/client/ygg-chat-r/release

          RELEASE_NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          shopt -s nullglob
          manifests=(latest*.yml)
          shopt -u nullglob

          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "ERROR: No latest*.yml manifest found in release directory"
            exit 1
          fi

          for manifest in "${manifests[@]}"; do
            awk '
              BEGIN { skip = 0 }
              /^releaseNotes:/ { skip = 1; next }
              skip && /^[^[:space:]]/ { skip = 0 }
              !skip { print }
            ' "${manifest}" > "${manifest}.tmp"
            mv "${manifest}.tmp" "${manifest}"

            {
              echo ""
              echo "releaseNotes: |-"
              sed 's/^/  /' "${RELEASE_NOTES_FILE}"
            } >> "${manifest}"

            echo "Injected release notes into ${manifest}"
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          if-no-files-found: error
          # Only the files the GitHub-Releases update feed needs (no unpacked dirs or builder debug files).
          path: |
            ygg-chat/client/ygg-chat-r/release/*.dmg
            ygg-chat/client/ygg-chat-r/release/*.zip
            ygg-chat/client/ygg-chat-r/release/*.deb
            ygg-chat/client/ygg-chat-r/release/*.exe
            ygg-chat/client/ygg-chat-r/release/*.blockmap
            ygg-chat/client/ygg-chat-r/release/latest*.yml

  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Validate tag matches app version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(node -p "require('./ygg-chat/client/ygg-chat-r/package.json').version")"

          if [ "${TAG_VERSION}" != "${APP_VERSION}" ]; then
            echo "ERROR: Tag version (${TAG_VERSION}) does not match package version (${APP_VERSION})"
            exit 1
          fi

      - name: Extract release notes from changelog
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG_FILE="ygg-chat/client/ygg-chat-r/CHANGELOG.md"
          RELEASE_NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          RAW_RELEASE_NOTES_FILE="${RELEASE_NOTES_FILE}.raw"

          : > "${RAW_RELEASE_NOTES_FILE}"

          if [ -f "${CHANGELOG_FILE}" ]; then
            awk -v ver="${VERSION}" '
              $0 ~ "^## \\[" ver "\\]" || $0 ~ "^## " ver "([[:space:]-]|$)" {
                in_section = 1
                next
              }
              in_section && /^## / { exit }
              in_section { print }
            ' "${CHANGELOG_FILE}" > "${RAW_RELEASE_NOTES_FILE}" || true
          else
            echo "WARNING: ${CHANGELOG_FILE} not found; using fallback release notes"
          fi

          awk '
            BEGIN { started = 0 }
            {
              if (!started && $0 ~ /^[[:space:]]*$/) next
              started = 1
              print
            }
          ' "${RAW_RELEASE_NOTES_FILE}" > "${RELEASE_NOTES_FILE}" || true

          if ! grep -q '[^[:space:]]' "${RELEASE_NOTES_FILE}" 2>/dev/null; then
            printf 'Release %s\n\nAutomated release build.\nChangelog entry missing, empty, or malformed, so fallback release notes were used.\n' "${VERSION}" > "${RELEASE_NOTES_FILE}"
            echo "WARNING: No usable changelog entry found for version ${VERSION}; using fallback release notes"
          else
            echo "Release notes extracted to ${RELEASE_NOTES_FILE}"
          fi

          echo "RELEASE_NOTES_FILE=${RELEASE_NOTES_FILE}" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: ygg-chat/client/ygg-chat-r/release-merged

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ygg-chat/client/ygg-chat-r/release-merged/*.dmg
            ygg-chat/client/ygg-chat-r/release-merged/*.zip
            ygg-chat/client/ygg-chat-r/release-merged/*.deb
            ygg-chat/client/ygg-chat-r/release-merged/*.exe
            ygg-chat/client/ygg-chat-r/release-merged/*.blockmap
            ygg-chat/client/ygg-chat-r/release-merged/latest*.yml
          body_path: ${{ env.RELEASE_NOTES_FILE }}
          draft: false
          prerelease: false
