<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graviton · Tool settings concepts</title>
<style>
:root{color-scheme:dark;--page:#19181e;--shell:rgba(255,255,255,.035);--surface:rgba(255,255,255,.055);--hover:rgba(255,255,255,.085);--text:#eeeaf1;--muted:#aaa5b3;--accent:#ffc49b;--active:rgba(255,172,111,.14);--code:#141318;--track:#66616c;--thumb:#231b16;--acc-expand:250ms;--acc-collapse:250ms;--acc-chevron:250ms;--acc-ease:cubic-bezier(.22,1,.36,1);--duration-quick:150ms;--duration-fast:250ms;--ease-smooth-out:cubic-bezier(.22,1,.36,1)}
html[data-theme="light"]{color-scheme:light;--page:#efedf0;--shell:rgba(255,255,255,.48);--surface:rgba(255,255,255,.65);--hover:rgba(255,255,255,.95);--text:#29262c;--muted:#706a77;--accent:#275fa7;--active:rgba(52,112,203,.10);--code:#e9e7ec;--track:#b4aeb9;--thumb:#eaf1ff}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1.5;transition:background-color var(--duration-fast),color var(--duration-fast)}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{transition:background-color var(--duration-quick),color var(--duration-quick),transform var(--duration-quick)}button:active{transform:scale(.97)}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}header{max-width:1600px;margin:auto;padding:32px 30px 22px;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:25px;letter-spacing:-.8px;margin:4px 0 6px;font-weight:600}.eyebrow{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:var(--accent)}p{margin:0;color:var(--muted)}.pill{display:inline-flex;gap:8px;align-items:center;border-radius:30px;padding:9px 14px;background:var(--surface);white-space:nowrap}.pill:hover{background:var(--hover)}main{max-width:1600px;margin:auto;padding:0 30px 30px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.concept{min-width:0}.concept-title{display:flex;gap:10px;align-items:baseline;margin:10px 0 5px}.concept-title h2{font-size:16px;font-weight:600;margin:0}.number{font-size:11px;color:var(--accent);font-family:monospace}.pitch{font-size:12px;min-height:43px}.window{background:var(--shell);border-radius:26px;padding:16px;backdrop-filter:blur(20px);min-height:665px}.chrome{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 2px 17px}.chrome strong{font-size:15px;font-weight:600}.round{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--surface)}.round:hover{background:var(--hover)}.section-title{display:flex;gap:9px;align-items:center;margin:0 0 14px}.section-title>svg{color:var(--accent)}.section-title h3{font-size:14px;font-weight:600;margin:0}.section-title p{font-size:11px}.search{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface);border-radius:20px;margin-bottom:12px;color:var(--muted)}input{width:100%;min-width:0;color:var(--text);background:none;border:0;outline:none;font-size:12px}input::placeholder{color:var(--muted)}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px}.actions p{font-size:11px}.actions .pill{font-size:11px;padding:6px 10px}.group-label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;margin:16px 3px 8px}.group-label span:last-child{margin-left:auto;font-size:10px}.count{font-size:10px;border-radius:12px;background:var(--surface);padding:0 6px}.tool{border-radius:15px;background:var(--surface);margin-bottom:5px;overflow:hidden;transition:background-color var(--duration-quick)}.tool:hover{background:var(--hover)}.tool[data-open="true"]{background:var(--surface)}.row{display:flex;align-items:center;padding:4px 8px 4px 4px;gap:2px;min-height:54px}.t-acc-head{flex:1;min-width:0;display:flex;align-items:center;gap:9px;text-align:left;padding:6px 7px;border-radius:10px}.tool-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--shell);color:var(--muted);flex-shrink:0}.identity{min-width:0;flex:1}.name{font-size:12px;font-weight:550;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.desc{font-size:10px;color:var(--muted);display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:210px}.t-acc-chevron svg{width:14px;height:14px}.switch{padding:8px 4px;flex-shrink:0;width:40px;display:grid;place-items:center}.track{display:block;width:28px;height:16px;border-radius:20px;background:var(--track);position:relative;transition:background-color var(--duration-quick)}.track:after{content:"";position:absolute;left:3px;top:3px;width:10px;height:10px;background:var(--page);border-radius:50%;transition:transform var(--duration-fast) var(--ease-smooth-out),background-color var(--duration-quick)}.switch[aria-checked="true"] .track{background:var(--accent)}.switch[aria-checked="true"] .track:after{transform:translateX(12px);background:var(--thumb)}
/* transitions.dev accordion: grid owns layout; inner clips content. */
.t-acc-panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--acc-collapse) var(--acc-ease);
}
.t-acc[data-open="true"] .t-acc-panel {
  grid-template-rows: 1fr;
  transition: grid-template-rows var(--acc-expand) var(--acc-ease);
}
.t-acc-panel-inner {
  overflow: hidden;
  opacity: 0;
  filter: blur(2px);
  transition:
    opacity var(--acc-collapse) var(--acc-ease),
    filter var(--acc-collapse) var(--acc-ease);
}
.t-acc[data-open="true"] .t-acc-panel-inner {
  opacity: 1;
  filter: blur(0);
  transition:
    opacity var(--acc-expand) var(--acc-ease),
    filter var(--acc-expand) var(--acc-ease);
}
.t-acc-chevron {
  display: inline-flex;
  transform: scaleY(1);
  transform-origin: center;
  transition: transform var(--acc-chevron) var(--acc-ease);
}
.t-acc-chevron path { vector-effect: non-scaling-stroke; }
.t-acc[data-open="true"] .t-acc-chevron {
  transform: scaleY(-1);
}
@media (prefers-reduced-motion: reduce) {
  .t-acc-panel, .t-acc-panel-inner, .t-acc-chevron {
    transition: none !important;
  }
}
.detail{padding:3px 13px 14px}.detail>p{font-size:11px;margin:4px 0 10px}.meta{display:flex;justify-content:space-between;gap:5px;margin-bottom:9px;font:10px ui-monospace,SFMono-Regular,monospace;color:var(--accent)}.schema{border-radius:12px;background:var(--code);padding:10px}.schema h4{margin:0 0 8px;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.6px;text-transform:uppercase}.param{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:9px;font-size:10px}.param:last-child{margin:0}.param code{color:var(--text);font-size:11px}.param .type{color:var(--accent);font:10px monospace}.param small{grid-column:1/-1;color:var(--muted);font-size:10px}.required{color:var(--accent);font-size:9px;margin-left:5px}details{margin-top:10px;font-size:10px;color:var(--muted)}summary{cursor:pointer;display:list-item}pre{font-size:10px;line-height:1.6;overflow:auto;max-height:220px;color:var(--text);margin-bottom:0;white-space:pre-wrap;overflow-wrap:anywhere}.hint{font-size:10px;margin:14px 3px 0}.tiles .group-tools{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:start}.tiles .tool{margin:0;border-radius:17px}.tiles .row{flex-wrap:wrap;padding:9px;gap:0}.tiles .t-acc-head{width:100%;flex-basis:100%;padding:0;align-items:flex-start;min-height:62px;gap:7px}.tiles .tool-icon{width:24px;height:24px}.tiles .tool-icon svg{width:15px;height:15px}.tiles .name{font-size:11px;white-space:normal;line-height:1.35}.tiles .desc{white-space:normal;font-size:10px;line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.tiles .t-acc-chevron{margin-top:4px}.tiles .switch{margin-left:auto;padding:4px 0 0;width:32px}.tile-status{display:none;font-size:9px;color:var(--muted)}.tiles .tile-status{display:block;flex:1}.tiles .detail{padding:0 10px 12px}.tiles .meta{display:block;font-size:9px}.tiles .meta span{display:block}.tiles .param{grid-template-columns:1fr}.tiles .schema{padding:8px}.tiles .required{display:inline}.ledger .group-tools{background:var(--surface);border-radius:15px;padding:3px}.ledger .tool{background:transparent;margin:0;border-radius:10px}.ledger .tool:hover{background:var(--shell)}.ledger .tool[data-open="true"]{background:var(--shell)}.ledger .row{min-height:42px;padding:1px 5px}.ledger .tool-icon{display:none}.ledger .t-acc-head{gap:10px;flex-direction:row-reverse;padding:6px}.ledger .desc{display:none}.ledger .name{font:11px ui-monospace,SFMono-Regular,monospace}.ledger .detail{padding-left:29px}.ledger .schema{background:var(--surface)}.ledger .hint{margin-top:23px}.footer{max-width:1600px;margin:0 auto;padding:0 30px 30px;font-size:11px;color:var(--muted)}.empty{font-size:11px;padding:10px}[hidden]{display:none!important}@media(max-width:1100px){main{grid-template-columns:1fr;max-width:730px}.window{min-height:0}.pitch{min-height:0;margin-bottom:12px}.tiles .desc{max-width:none}header{max-width:730px}}@media(max-width:500px){header{padding:20px;align-items:flex-start}main{padding:0 14px 20px}.pill{padding:8px 10px}h1{font-size:21px}.window{padding:13px}.footer{padding:0 20px 20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head>
<body><header><div><div class="eyebrow">Graviton / Design study</div><h1>Tools, without the bulk.</h1><p>Three compact directions. Expand a tool to inspect its schema.</p></div><button class="pill" id="theme" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg><span>Dark mode</span></button></header>
<main id="concepts"></main><div class="footer">Interactive design preview only · Toggles and search are local to each variant · Custom & MCP definitions are illustrative · No app settings are changed.</div>
<script>
const icons={tool:'<path d="m14.7 6.3 3 3a6 6 0 0 1-7.4 7.4L5 22l-3-3 5.3-5.3a6 6 0 0 1 7.4-7.4Z"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',code:'<path d="m8 8-4 4 4 4m8-8 4 4-4 4m-3-11-2 14"/>',server:'<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',reload:'<path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
const svg=(name)=>'<svg aria-hidden="true" viewBox="0 0 24 24">'+icons[name]+'</svg>';
const chevron='<span class="t-acc-chevron"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M4 6.5L8 10.5L12 6.5"/></svg></span>';
const tools=[
{name:'read_file',label:'Read file',group:'Built-in',description:'Read UTF-8 text with a bounded content budget, including line and range reads.',enabled:true,params:[['path','string',true,'Absolute or relative file path.'],['maxBytes','integer',false,'UTF-8 budget · default 204800 · 1–5242880.'],['startLine','integer',false,'First line to read, inclusive (1-based).']],note:'Representative fields · full schema available in JSON.'},
{name:'context_status',label:'Context status',group:'Built-in',description:'Report approximate context used and left in the current branch or run.',enabled:true,params:[]},
{name:'watcher',label:'Watcher',group:'Built-in',description:'Register branch-scoped asynchronous watches for files, processes, logs, and HTTP status.',enabled:false,params:[['action','string',true,'start, status, cancel, or list.'],['kind','string',false,'process_exit, file_created, file_changed, log_match, http_status.'],['timeoutMs','integer',false,'Watch deadline · default 300000.']]},
{name:'weekly_digest',label:'Weekly digest',group:'Custom',description:'Summarize project activity into a short weekly report.',enabled:true,params:[['project','string',true,'Project name to summarize.'],['days','integer',false,'Look-back window · default 7.']]},
{name:'image_resize',label:'Image resize',group:'Custom',description:'Resize a local image while preserving its aspect ratio.',enabled:false,params:[['path','string',true,'Source image file.'],['width','integer',true,'Target width in pixels.']]},
{name:'search_docs',label:'Search docs',group:'MCP',server:'Documentation',description:'Search documentation from the connected knowledge server.',enabled:true,params:[['query','string',true,'Search text.'],['limit','integer',false,'Maximum results · default 10.']]},
{name:'list_projects',label:'List projects',group:'MCP',server:'Workspace',description:'List projects available on the workspace server.',enabled:true,params:[['archived','boolean',false,'Include archived projects · default false.']]}
];
const variants=[{className:'list',title:'Soft list',pitch:'Balanced density. Quiet rows, readable descriptions.',height:'54px rows',number:'01'},{className:'tiles',title:'Small tiles',pitch:'A compact library. Two columns, independent disclosure.',height:'Two-column layout',number:'02'},{className:'ledger',title:'Tool ledger',pitch:'Maximum scanability. Names first, details on demand.',height:'42px rows',number:'03'}];
const escape=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function schema(t){const properties=Object.fromEntries(t.params.map(p=>[p[0],{type:p[1],description:p[3]}]));return {type:'object',properties,required:t.params.filter(p=>p[2]).map(p=>p[0])};}
function toolHTML(t,v,index){const id='detail-'+v+'-'+index;return '<article class="tool t-acc" data-open="false" data-search="'+escape(t.label+' '+t.name+' '+t.description+' '+(t.server||''))+'"><div class="row"><button type="button" class="t-acc-head" aria-expanded="false" aria-controls="'+id+'"><span class="tool-icon">'+svg(t.group==='MCP'?'server':t.group==='Custom'?'code':'file')+'</span><span class="identity"><span class="name">'+escape(v===2?t.name:t.label)+'</span><span class="desc">'+escape(t.description)+'</span></span>'+chevron+'</button><span class="tile-status">'+(t.group==='MCP'?escape(t.server):t.group)+'</span><button class="switch" type="button" role="switch" aria-checked="'+t.enabled+'" aria-label="Enable '+escape(t.label)+'" title="Enable '+escape(t.label)+'"><span class="track"></span></button></div><div class="t-acc-panel" id="'+id+'" aria-hidden="true" inert><div class="t-acc-panel-inner"><div class="detail"><div class="meta"><span>'+escape(t.name)+'</span><span>'+escape(t.server||t.group)+' · '+t.params.filter(p=>p[2]).length+' required</span></div><p>'+escape(t.description)+'</p><div class="schema"><h4>Input schema · object</h4>'+(t.params.length?t.params.map(p=>'<div class="param"><div><code>'+p[0]+'</code>'+(p[2]?'<span class="required">required</span>':'')+'</div><span class="type">'+p[1]+'</span><small>'+escape(p[3])+'</small></div>').join(''):'<p style="font-size:11px">No parameters. Call with an empty object.</p>')+'</div><details><summary>View JSON schema'+(t.name==='context_status'?'':' (sample)')+'</summary><pre>'+escape(JSON.stringify(schema(t),null,2))+'</pre></details></div></div></div></article>';}
document.getElementById('concepts').innerHTML=variants.map((v,n)=>'<section class="concept '+v.className+'"><div class="concept-title"><span class="number">'+v.number+'</span><h2>'+v.title+'</h2></div><p class="pitch">'+v.pitch+'</p><div class="window"><div class="chrome"><strong>Chat settings</strong><span class="eyebrow">Preview '+v.number+'</span></div><div class="section-title">'+svg('tool')+'<div><h3>Tools</h3><p>Built-in, custom, and MCP</p></div></div><label class="search">'+svg('search')+'<input type="search" placeholder="Find a tool…" aria-label="Search tools in '+v.title+'"></label><div class="actions"><p>7 tools · <span class="enabled-count">5</span> enabled</p><button class="pill collapse-all" type="button">Collapse all</button></div>'+['Built-in','Custom','MCP'].map(g=>'<section class="tool-group"><div class="group-label">'+g+' <span class="count">'+tools.filter(t=>t.group===g).length+'</span><span>'+(g==='MCP'?'By server':g==='Custom'?'Sample tools':'Native tools')+'</span></div><div class="group-tools">'+tools.map((t,i)=>t.group===g?toolHTML(t,n,i):'').join('')+'</div></section>').join('')+'<p class="empty" hidden>No matching tools.</p><p class="hint">'+v.height+' · Disclosure and enable are separate actions.</p></div></section>').join('');
function disclose(acc,open){acc.dataset.open=String(open);acc.querySelector('.t-acc-head').setAttribute('aria-expanded',String(open));const panel=acc.querySelector('.t-acc-panel');panel.setAttribute('aria-hidden',String(!open));panel.inert=!open;}
document.querySelectorAll('.t-acc').forEach(acc=>{acc.querySelector('.t-acc-head').addEventListener('click',()=>disclose(acc,acc.dataset.open!=='true'));});
document.querySelectorAll('.concept').forEach(concept=>{concept.querySelectorAll('.switch').forEach(toggle=>toggle.addEventListener('click',()=>{toggle.setAttribute('aria-checked',String(toggle.getAttribute('aria-checked')!=='true'));concept.querySelector('.enabled-count').textContent=concept.querySelectorAll('.switch[aria-checked="true"]').length;}));concept.querySelector('.collapse-all').addEventListener('click',()=>concept.querySelectorAll('.t-acc').forEach(acc=>{acc.querySelector('details').open=false;disclose(acc,false);}));concept.querySelector('input').addEventListener('input',event=>{const value=event.target.value.toLowerCase().trim();concept.querySelectorAll('.tool').forEach(tool=>tool.hidden=!tool.dataset.search.toLowerCase().includes(value));concept.querySelectorAll('.tool-group').forEach(group=>group.hidden=!group.querySelector('.tool:not([hidden])'));concept.querySelector('.empty').hidden=!!concept.querySelector('.tool:not([hidden])');});});
document.getElementById('theme').addEventListener('click',function(){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';this.setAttribute('aria-pressed',String(dark));this.querySelector('span').textContent=dark?'Dark mode':'Light mode';});
// Start with one disclosure open in each direction, showing every source across the comparison.
disclose(document.querySelector('.list .tool'),true);disclose(document.querySelectorAll('.tiles .tool')[3],true);disclose(document.querySelectorAll('.ledger .tool')[5],true);
</script></body></html>
